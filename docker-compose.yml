version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: chainmind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chainmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chainmind_dev}
      POSTGRES_DB: ${POSTGRES_DB:-chainmind}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chainmind}"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5-community
    container_name: chainmind-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-chainmind_dev}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_max__size: 1G
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./db/neo4j/init.cypher:/var/lib/neo4j/import/init.cypher:ro
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD:-chainmind_dev} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: chainmind-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://chainmind:chainmind_dev@postgres:5432/chainmind
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: chainmind_dev
      ETH_RPC_URL: ${ETH_RPC_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app:ro

  indexer:
    build: ./indexer
    container_name: chainmind-indexer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: postgres://chainmind:chainmind_dev@postgres:5432/chainmind
      RPC_ETH_HTTP: ${ETH_RPC_URL:-https://eth.llamarpc.com}
      SQD_GATEWAY: ${SQD_GATEWAY:-https://v2.archive.subsquid.io/network/ethereum-mainnet}
    volumes:
      - ./indexer:/app:ro

volumes:
  pgdata:
  neo4j_data:
  neo4j_logs:
